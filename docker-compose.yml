# Docker Compose stack for the singer portal.
#
# Deploy with Portainer (Stacks → Add stack → Repository) or the CLI:
#   docker compose pull && docker compose up -d
#
# The image is built and published to GHCR by .github/workflows/ci.yml. Put the
# environment values either in a local .env (CLI) or in the stack's Environment
# variables (Portainer) — both feed the ${...} substitutions below.
#
# Optional TLS reverse proxy: add `--profile tls` (CLI) or set the stack to use
# the tls profile (see Caddyfile and PORTAL_DOMAIN).
services:
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/johnmain/mainteckj-songrequest:latest}
    pull_policy: always
    container_name: maintec-kj-portal
    restart: unless-stopped
    environment:
      # The database always lives on the mounted volume.
      DATABASE_URL: /data/local.db
      # Everything below is supplied by .env (CLI) / stack env vars (Portainer).
      ORIGIN: ${ORIGIN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      AUTH_EMAIL_PASSWORD_ENABLED: ${AUTH_EMAIL_PASSWORD_ENABLED:-false}
      # Resend (https://resend.com) — powers password-reset emails. Optional.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Max request body adapter-node accepts. The song-catalog ingest is
      # several MB, well over the 512 KB default, so allow 16 MB.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-16M}
      HOST_BRIDGE_TOKEN: ${HOST_BRIDGE_TOKEN:-}
    ports:
      # Bind address for the published port.
      #  - 127.0.0.1 (default): only reachable from this host. Use it when a
      #    reverse proxy on the same host dials localhost (e.g. `netbird expose`).
      #  - 0.0.0.0: accept on every interface. Required for NetBird's dashboard
      #    Reverse Proxy with a "Peer" target, which connects to the peer's
      #    overlay IP (100.x), not loopback.
      - '${PORTAL_BIND:-127.0.0.1}:3000:3000'
    volumes:
      # Named volume by default; set PORTAL_DATA to a host path to bind-mount.
      - ${PORTAL_DATA:-portal_data}:/data
    healthcheck:
      # 127.0.0.1, not localhost: inside alpine "localhost" resolves to ::1
      # first, but the app listens on IPv4 only, which reads as "refused".
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # NetBird sidecar. It shares the portal's network namespace, so the peer's
  # WireGuard interface (wt0) and overlay IP (100.x) live alongside the app.
  # That lets NetBird's dashboard Reverse Proxy with a "Peer" target reach
  # 0.0.0.0:3000 while the published host port stays loopback-only (the same
  # layout the OpenKJ stack used). Set NETBIRD_SETUP_KEY (dashboard -> Settings
  # -> Setup Keys) or this container will not connect. If you run the NetBird
  # client on the host instead, comment this service out.
  netbird:
    image: netbirdio/netbird:latest
    container_name: maintec-kj-netbird
    restart: unless-stopped
    depends_on:
      - portal
    network_mode: service:portal
    # Kernel WireGuard needs NET_ADMIN/SYS_MODULE; eBPF needs SYS_ADMIN/SYS_RESOURCE.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NB_SETUP_KEY: ${NETBIRD_SETUP_KEY:-}
    volumes:
      - netbird_client_data:/var/lib/netbird

  # Optional TLS termination. Point a DNS name at this VM and set PORTAL_DOMAIN.
  # If Netbird's ingress already fronts the portal, leave this profile off.
  caddy:
    image: caddy:2-alpine
    container_name: maintec-kj-caddy
    restart: unless-stopped
    profiles: ['tls']
    depends_on:
      - portal
    ports:
      - '80:80'
      - '443:443'
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-karaoke.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  portal_data:
  caddy_data:
  caddy_config:
  netbird_client_data:
