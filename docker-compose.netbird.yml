# ---------------------------------------------------------------------------
# Optional NetBird sidecar for the singer portal.
#
# Why this exists: NetBird's dashboard Reverse Proxy with a "Peer" target sends
# traffic to the peer's overlay IP (100.x), not to loopback. A service published
# only on 127.0.0.1 would never answer. Running NetBird *inside the portal's
# network namespace* puts the WireGuard interface (wt0) and its overlay IP in
# the same namespace as the app, so the proxy reaches 0.0.0.0:3000 directly and
# the published host port can stay loopback-only. This is the same layout the
# OpenKJ stack used (NetBird alongside the app).
#
# Enable as an additional compose path:
#   docker compose -f docker-compose.yml -f docker-compose.netbird.yml up -d
#
# Portainer (stack deployed from Git): add `docker-compose.netbird.yml` under
# the stack's "Additional paths", set NETBIRD_SETUP_KEY in the stack's
# environment variables, then pull and redeploy.
# ---------------------------------------------------------------------------
services:
  netbird:
    image: netbirdio/netbird:latest
    container_name: maintec-kj-netbird
    restart: unless-stopped
    depends_on:
      - portal
    # Share the portal container's network namespace: wt0 (and the peer's 100.x
    # overlay IP) live alongside the app on port 3000.
    network_mode: service:portal
    # Kernel WireGuard needs NET_ADMIN/SYS_MODULE; eBPF needs SYS_ADMIN/SYS_RESOURCE.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # Setup key from the NetBird dashboard (Settings -> Setup Keys).
      # Prefer a reusable key; a one-off key is consumed on first registration.
      NB_SETUP_KEY: ${NETBIRD_SETUP_KEY:?set NETBIRD_SETUP_KEY in the stack environment}
    volumes:
      # Persists the peer identity so a restart doesn't re-register.
      - netbird_client_data:/var/lib/netbird

volumes:
  netbird_client_data:
